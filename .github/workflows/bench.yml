name: bench

on: [push]

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8                  # from their workflow
    steps:
      - uses: actions/checkout@v5
      - uses: snok/install-poetry@v1           # from their workflow: installs Poetry
        with:
          version: "2.0.1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "poetry"                      # reuses downloaded packages between runs
      - run: poetry install --all-extras       # from their workflow
      - run: poetry run pip install git+https://github.com/ashmeenkhaira/test-splitter   # ours
      - run: poetry run coverage run -m pytest --durations=10 -m "not linting and not super_slow and not flaky"   # their exact command
      - uses: actions/upload-artifact@v7       # ours, same as networkx
        if: always()
        with:
          name: durations
          path: .test-durations.json
          include-hidden-files: true

  naive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: snok/install-poetry@v1
        with:
          version: "2.0.1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "poetry"
      - run: poetry install --all-extras
      - run: poetry run pip install git+https://github.com/ashmeenkhaira/test-splitter
      - run: rm .test-durations.json                 # no timings -> split by count
      - run: poetry run coverage run -m pytest --durations=10 -m "not linting and not super_slow and not flaky" --shard ${{ matrix.shard }} --num-shards 4
      - uses: actions/upload-artifact@v7             # this shard's own timings
        if: always()
        with:
          name: durations-naive-${{ matrix.shard }}
          path: .test-durations.shard${{ matrix.shard }}.json
          include-hidden-files: true

  timesplit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: snok/install-poetry@v1
        with:
          version: "2.0.1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "poetry"
      - run: poetry install --all-extras
      - run: poetry run pip install git+https://github.com/ashmeenkhaira/test-splitter
      - run: poetry run coverage run -m pytest --durations=10 -m "not linting and not super_slow and not flaky" --shard ${{ matrix.shard }} --num-shards 4
      - uses: actions/upload-artifact@v7             # this shard's own timings
        if: always()
        with:
          name: durations-timesplit-${{ matrix.shard }}
          path: .test-durations.shard${{ matrix.shard }}.json
          include-hidden-files: true
